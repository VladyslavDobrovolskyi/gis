name: 📚 Compile & Deploy Docs

on:
  push:
    branches:
      - dev

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-docs:
    name: 🛠️ Build Docs
    environment: development
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[DOCS]')
    outputs:
      build_id: ${{ steps.prep.outputs.build_id }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Prepare naming
        id: prep
        run: |
          echo "build_id=${{ vars.ENV_TAG }}-docs-${{ github.run_number }}-$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: 🖨️ Compile Typst files
        run: |
          set -euo pipefail
          mkdir -p docs/output
          shopt -s nullglob
          files=(docs/raw/*.typ)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No .typ files found in docs/raw" && exit 0
          fi

          for f in "${files[@]}"; do
            name=$(basename "$f" .typ)
            echo "Compiling $f -> docs/output/$name.pdf"
            
            # Мы монтируем текущую папку в /app контейнера
            # И вызываем команду БЕЗ слова 'typst' в начале, так как оно уже в entrypoint
            docker run --rm \
              -v "$PWD":/app \
              -w /app \
              ghcr.io/typst/typst:latest \
              compile "$f" "docs/output/$name.pdf"
          done

      - name: 🚚 Upload Docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-output
          path: docs/output
          retention-days: 1

  deploy-docs:
    name: 📡 Deploy Docs to Server
    needs: build-docs
    environment: development
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Docs Output
        uses: actions/download-artifact@v4
        with:
          name: docs-output
          path: docs/output

      - name: 📤 Copy PDFs to Server (documentation)
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.DEPLOYER_USERNAME }}
          key: ${{ secrets.DEPLOYER_SSH }}
          source: 'docs/output/*.pdf'
          target: '${{ vars.DEPLOYER_PATH }}/documentation/'
          strip_components: 2
