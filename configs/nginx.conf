server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://geogis.tech$request_uri;
}


server {
    listen 80;
    server_name geogis.tech www.geogis.tech dev.geogis.tech www.dev.geogis.tech;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dev.geogis.tech www.dev.geogis.tech;

    ssl_certificate /etc/letsencrypt/live/geogis.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geogis.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    auth_basic "Protected Development Environment";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location = /docs {
        return 301 $scheme://$host/docs/;
    }

    location /overview {

        alias /var/www/documentation;

        charset utf-8;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /reports {

        alias /var/www/reports;

        charset utf-8;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location ~ ^/(api|trpc|docs)/ {
        proxy_pass http://backend_development:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_development:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;


        proxy_intercept_errors on;
        error_page 404 =301 $scheme://$host/;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }



}

